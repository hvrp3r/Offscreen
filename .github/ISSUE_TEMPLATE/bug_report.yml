name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Component
      options:
        - Core
        - TV client
        - Mobile app
        - Extension
        - Extension SDK
        - Themes
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Linux
        - Windows
        - macOS
        - Android
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings, About. Use the commit hash for a development build.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, without credentials or personal data.
      render: text
