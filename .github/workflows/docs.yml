name: Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/docs.sh
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - scripts/docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the documentation image
        uses: docker/build-push-action@v7
        with:
          context: docs
          tags: offscreen-docs
          load: true
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max

      - name: Build every language
        run: scripts/docs.sh build
        env:
          DOCS_SITE_URL: /${{ github.event.repository.name }}/

      - name: Report translation coverage
        run: |
          {
            echo "## Translation coverage"
            echo '```'
            scripts/docs.sh stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
